    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd38a"/><stop offset="1" stop-color="#3f9d5a"/></linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#c)"/>
  <circle cx="240" cy="62" r="24" fill="#fff3b0"/>
