  <path d="M86 268 L80 290 M106 270 L102 292 M150 270 L154 292 M168 268 L174 290" stroke="#8a4b1c" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M62 250 C50 244 44 236 46 228" fill="none" stroke="#a65a22" stroke-width="7" stroke-linecap="round"/>
